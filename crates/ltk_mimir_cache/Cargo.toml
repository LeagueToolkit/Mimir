[package]
name = "ltk_mimir_cache"
description = "Shared, versioned on-disk cache and updater for League Toolkit .lhdb hash tables"
readme = "README.md"
keywords = ["league-of-legends", "hash", "cache", "hashdb"]
categories = ["caching", "game-development"]
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
ltk_hashdb.workspace = true
directories.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
ureq = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

[features]
default = []
ureq = ["dep:ureq"]
reqwest = ["dep:reqwest"]

[dev-dependencies]
pollster.workspace = true
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true
